<div class="container-md">
    <div class="carousel-container">
        <div #carouselTrack class="carousel-track" (scroll)="onCarouselScroll($event)" (touchstart)="onTouchStart()"
            (touchend)="onTouchEnd()">
            @for (tip of tips; track $index) {
            <div class="carousel-slide">
                <ion-item lines="none" color="light" class="rounded-3 tip-item">
                    <ion-icon [name]="tip.img" slot="start" [color]="tip.imgColor" size="large"></ion-icon>
                    <ion-label class="ion-text-wrap">
                        <h2>{{ tip.header }}</h2>
                        <p class="text-muted">{{ tip.body }}</p>
                    </ion-label>
                </ion-item>
            </div>
            }
        </div>
        <div class="carousel-dots">
            @for (tip of tips; track $index) {
            <span class="dot" [class.active]="$index === activeTipIndex"></span>
            }
        </div>
    </div>
</div>
